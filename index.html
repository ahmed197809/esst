<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عروض الأسعار – المصرية لتكنولوجيا أنظمة المراقبة</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2733;--mut:#6b7684;--pri:#1d5fa8;--gold:#b8923a;--bd:#e2dfd6;--ok:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mut:#97a1ae;--pri:#5b9be0;--gold:#d6b25e;--bd:#2c3441;--ok:#4cc27f}}
:root[data-theme=dark]{--bg:#14181e;--card:#1d232c;--tx:#e8ecf1;--mut:#97a1ae;--pri:#5b9be0;--gold:#d6b25e;--bd:#2c3441;--ok:#4cc27f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:12px}
header{display:flex;align-items:center;gap:12px;padding:8px 0}
header img{width:56px;height:56px;object-fit:contain;border-radius:8px;background:#fff}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
nav{display:flex;gap:6px;margin:8px 0 14px}
nav button{flex:1;padding:10px 2px;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{padding:9px 14px;border:0;border-radius:9px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
.btn.g{background:var(--gold)}.btn.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.r{background:#c0392b}.btn.w{background:#1f8a4c}
.btn.s{padding:5px 10px;font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.li:last-child{border:0}.mut{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:5px;border-bottom:1px solid var(--bd);text-align:center;font-size:13px}
th{color:var(--mut);font-weight:600}td input,td select{padding:6px;min-width:70px}
td.nm input{min-width:120px;text-align:right}
.tot{display:grid;gap:4px;margin-top:10px;max-width:340px;margin-inline-start:auto}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:18px;font-weight:700;color:var(--ok);border-top:2px solid var(--bd);padding-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;padding:12px;z-index:20}
#offer{background:#fff;color:#222;max-width:760px;margin:auto;padding:24px;border-radius:12px}
#offer table{min-width:0}#offer th{color:#555;background:#f2efe6}#offer td,#offer th{border-bottom:1px solid #ddd;font-size:14px}
.oh{display:flex;align-items:center;gap:14px;border-bottom:3px solid #b8923a;padding-bottom:10px;margin-bottom:12px}
.oh img{width:90px}.oh h2{margin:0;font-size:18px}.oh p{margin:2px 0;color:#444;font-size:14px}
@media print{body *{visibility:hidden}#offer,#offer *{visibility:visible}#ov{position:absolute;background:none;padding:0}#offer{position:absolute;inset:0 0 auto 0;max-width:none}.noprint{display:none!important}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d5fa8"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif}
header{background:linear-gradient(135deg,#1d5fa8,#0e3a6e);color:#fff;border-radius:16px;padding:12px 14px;margin:4px 0 10px;box-shadow:0 6px 18px rgba(14,58,110,.25)}
header small{color:#d6e4f7}header img{border:2px solid #b8923a}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
nav button{border-radius:999px;font-family:inherit;font-weight:600}
.card{box-shadow:0 2px 10px rgba(0,0,0,.05);border-radius:14px}
.btn{font-family:inherit;font-weight:600;border-radius:10px}
input,select,textarea{font-family:inherit}th{background:var(--bg)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;transition:opacity .5s}
#gate.off{opacity:0;pointer-events:none}
#gate img{width:200px;max-width:60vw;background:#fff;border-radius:24px;padding:14px;animation:pop .9s ease}
#gate h2{margin:0;font-size:20px}#gate .btn{font-size:16px;padding:12px 22px}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media print{#gate{display:none}}
</style></head><body>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

import{firebaseConfig}from'./firebase-config.js';
window.__start=async(uid,DB)=>{
const $=s=>document.querySelector(s),app=$('#app'),ov=$('#ov');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(v)||0,fmt=n=>Math.round(n).toLocaleString('en-US');
let C,merchants=[],quotes=[],S={markup:15,install:275,phone:'',wa:'',name:'المصرية لتكنولوجيا أنظمة المراقبة'},cur=null,tab='quotes',timer;
C=DB;
const rid=p=>p+Math.random().toString(36).slice(2,9);
const wa=(ph,t)=>{ph=String(ph).replace(/\D/g,'');if(ph.startsWith('0'))ph='20'+ph.slice(1);return 'https://wa.me/'+ph+'?text='+encodeURIComponent(t)};
const open=u=>window.open(u,'_blank');
C.onSnapshot(s=>{merchants=[];quotes=[];s.docs.forEach(d=>{const x={...d.data(),id:d.id};
 if(d.id==='settings')S={...S,...x};else if(d.id[0]==='m')merchants.push(x);else if(d.id[0]==='q')quotes.push(x)});
 quotes.sort((a,b)=>(b.at||0)-(a.at||0));if(!cur)render()},()=>{app.innerHTML='<div class="card">حصل خطأ في تحميل البيانات. لو الحساب مش حسابك المسموح، سجّل خروج وادخل بحسابك.</div>'});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;render()});
const saveQ=()=>{clearTimeout(timer);timer=setTimeout(()=>C.doc(cur.id).set(JSON.parse(JSON.stringify(cur))),600)};
const BR=['UNV','Uniarch','Hikvision','Dahua'],CAT=[
{k:'cam',t:'كاميرات',cam:1,items:BR.flatMap(b=>['2M','5M'].flatMap(m=>[['Dome','داخلية'],['Bullet','خارجية']].map(([t,w])=>`كاميرا ${b} ${m} ${t} (${w})`)))},
{k:'dvr',t:'DVR',items:BR.flatMap(b=>['2M','5M'].flatMap(m=>[4,8,16].map(p=>`DVR ${b} ${m} ${p} Port`)))},
{k:'hdd',t:'هارد ديسك',items:['500GB','1TB','2TB','3TB','4TB'].map(s=>`هارد ${s}`)},
{k:'acc',t:'مستلزمات',items:['كابل 3+1 رول 100 متر','كابل Coaxial RG59 + باور رول 100 متر','كابل شبكة Cat6 رول 305 متر','مصدر طاقة 12V 2A','مصدر طاقة 12V 5A (4 كاميرات)','مصدر طاقة 12V 10A (8 كاميرات)','مصدر طاقة 12V 20A (16 كاميرا)','Connector BNC','Connector DC','Balun','POE Switch 4 Port','POE Switch 8 Port','شاشة 19 بوصة']}];let lk='cam';const act=()=>quotes.filter(q=>!q.done),dones=()=>quotes.filter(q=>q.done);const isCam=it=>/^\s*(كاميرا|camera)(\s|$)/i.test(it.n||'');
function best(it){const p=it.prices||{};
 let b=null;for(const m of merchants){const v=num(p[m.id]);if(v>0&&(!b||v<b.v))b={m:m.id,v}}return b}
function line(it){const b=best(it);if(!b)return{b:null,u:0,t:0};const u=Math.round(b.v*(1+S.markup/100));return{b,u,t:u*num(it.q)}}
function calc(q){let sub=0,cams=0,miss=0;q.items.forEach(it=>{const l=line(it);sub+=l.t;if(!l.b&&it.n)miss++;if(isCam(it))cams+=num(it.q)});
 if(q.cams!==undefined&&q.cams!=='')cams=num(q.cams);const inst=cams*S.install,ex=num(q.extra);return{sub,cams,inst,ex,miss,total:sub+inst+ex}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(cur)return cur.done?clientPage():editor();if(tab==='quotes')list();else if(tab==='merchants')mer();else if(tab==='clients')cl();else if(tab==='profit')pf();else sett()}
function list(){app.innerHTML=`<button class="btn" id="nw">+ عرض سعر جديد</button><div class="card" style="margin-top:12px">${act().length?act().map(q=>`<div class="li" data-id="${q.id}"><div><b>${esc(q.client||'بدون اسم')}</b><div class="mut">${new Date(q.at).toLocaleDateString('en-GB')} · ${q.items.length} صنف</div></div><div><b>${fmt(calc(q).total)}</b> ج <button class="btn r s" data-del="${q.id}">حذف</button></div></div>`).join(''):'<span class="mut">لسه مفيش عروض.</span>'}</div>`;
 $('#nw').onclick=()=>{cur={id:rid('q'),at:Date.now(),client:'',phone:'',place:'',extra:'',items:[{n:'',q:1,cam:false,prices:{},pick:''}]};C.doc(cur.id).set(cur);render()};
 app.querySelectorAll('.li').forEach(e=>e.onclick=ev=>{const d=ev.target.dataset.del;if(d){if(ev.target.dataset.ok){C.doc(d).delete()}else{const b=ev.target;b.dataset.ok=1;b.textContent='اضغط للتأكيد';setTimeout(()=>{b.dataset.ok='';b.textContent='حذف'},3000)}return}cur=JSON.parse(JSON.stringify(quotes.find(q=>q.id===e.dataset.id)));render()})}
function editor(){const q=cur;
 app.innerHTML=`<button class="btn o s" id="bk">← رجوع للعروض</button>
<div class="card" style="margin-top:10px"><div class="row"><div><label>اسم العميل</label><input data-q="client" value="${esc(q.client)}"></div><div><label>تليفون العميل</label><input data-q="phone" inputmode="tel" value="${esc(q.phone)}"></div><div><label>المنطقة / ملاحظات</label><input data-q="place" value="${esc(q.place)}"></div></div></div>
<div class="card"><b>الأصناف المطلوبة</b><div class="row" style="margin:8px 0;align-items:end"><div><label>القسم</label><select id="ck">${CAT.map(c=>`<option value="${c.k}" ${c.k===lk?'selected':''}>${c.t}</option>`).join('')}</select></div><div style="grid-column:span 2"><label>الصنف</label><select id="ci"></select></div><div style="display:flex;gap:6px"><button class="btn" id="ca">+ إضافة للعرض</button><button class="btn o s" data-add="">+ صنف آخر</button></div></div>
<div class="tw"><table><thead><tr><th>الصنف</th><th>العدد</th>${merchants.map(m=>`<th>${esc(m.name)}</th>`).join('')}<th>سعر العميل</th><th>الإجمالي</th><th></th></tr></thead><tbody id="tb">${q.items.map(row).join('')}</tbody></table></div>
${merchants.length?'':'<p class="mut">ضيف التجار الأول من تبويب "التجار" عشان تقدر تسجل أسعارهم.</p>'}
<div style="margin-top:10px"><button class="btn g" id="snd">إرسال الطلب للتجار</button></div><div id="sp"></div></div>
<div class="card"><div class="row"><div><label>عدد الكاميرات للتركيب (فاضي = تلقائي)</label><input type="number" data-q="cams" placeholder="تلقائي" value="${esc(q.cams)}"></div><div><label>مصاريف إضافية (منطقة بعيدة)</label><input type="number" data-q="extra" value="${esc(q.extra)}"></div></div><div class="tot" id="tot"></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn w" id="pv">معاينة العرض للعميل</button><button class="btn g" id="dn">تم التركيب ✓</button></div></div>`;
 $('#bk').onclick=()=>{cur=null;render()};
 const fill=()=>{lk=$('#ck').value;$('#ci').innerHTML=CAT.find(c=>c.k===lk).items.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('')};$('#ck').onchange=fill;fill();
 $('#ca').onclick=()=>{const c=CAT.find(c=>c.k===lk);q.items.push({n:c.items[$('#ci').value],q:1,cam:!!c.cam,prices:{},pick:''});saveQ();editor()};
 app.oninput=app.onchange=e=>{const t=e.target,tr=t.closest('tr');
  if(t.dataset.q){q[t.dataset.q]=t.value}else if(tr){const it=q.items[tr.dataset.i];
   if(t.dataset.f)it[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;else if(t.dataset.m)it.prices[t.dataset.m]=t.value}
  else return;refresh();saveQ()};
 app.onclick=e=>{const a=e.target.closest('[data-add]'),d=e.target.closest('[data-rm]');
  if(a){q.items.push({n:a.dataset.add,q:1,cam:a.dataset.add==='كاميرا',prices:{},pick:''});saveQ();editor()}
  if(d){q.items.splice(d.dataset.rm,1);saveQ();editor()}};
 $('#snd').onclick=()=>{const all=q.items.filter(i=>i.n);let items=all.map(i=>`- ${i.n} × ${i.q}`).join('\n');
  $('#sp').innerHTML=merchants.length?`<p class="mut" style="margin:10px 0 4px">اختار الأصناف اللي عايز تطلب سعرها. الرسالة بتتبعت للتاجر بالأصناف بس، من غير تركيب ولا بيانات العميل:</p>${all.map((i,k)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" class="pk" data-k="${k}" checked style="width:auto"> ${esc(i.n)} × ${esc(i.q)}</label>`).join('')}<div class="chips">${merchants.map(m=>`<button class="btn w s" data-w="${m.id}">واتساب: ${esc(m.name)}</button>`).join('')}</div>`:'<p class="mut">مفيش تجار مسجلين.</p>';

const dvrOf=q=>q.items.filter(i=>/^\s*(DVR|XVR|NVR)(\s|$)/i.test(i.n||'')).map(i=>i.n).join(' + ');
function finish(){const c=calc(cur);let cost=0;cur.items.forEach(i=>{const b=best(i);if(b)cost+=b.v*num(i.q)});cur.done=true;cur.model=dvrOf(cur);cur.doneAt=Date.now();cur.snap={sub:c.sub,inst:c.inst,ex:c.ex,total:c.total,cost,profit:c.sub-cost+c.inst};clearTimeout(timer);C.doc(cur.id).set(JSON.parse(JSON.stringify(cur)));tab='clients';render()}
function cl(){app.innerHTML=`<input id="sr" placeholder="ابحث باسم العميل أو رقمه" style="margin-bottom:10px"><div class="card" id="cll"></div>`;
 const paint=()=>{const s=$('#sr').value.trim().toLowerCase(),L=dones().filter(q=>!s||((q.client||'')+(q.phone||'')).toLowerCase().includes(s));
 $('#cll').innerHTML=L.length?L.map(q=>`<div class="li" data-id="${q.id}"><div><b>${esc(q.client||'بدون اسم')}</b><div class="mut">${esc(q.phone)} · ${new Date(q.doneAt).toLocaleDateString('en-GB')}</div></div><div class="mut">${esc(q.model)}</div></div>`).join(''):'<span class="mut">مفيش عملاء لسه. دوس "تم التركيب" على أي عرض.</span>';
 $('#cll').querySelectorAll('.li').forEach(e=>e.onclick=()=>{cur=JSON.parse(JSON.stringify(quotes.find(q=>q.id===e.dataset.id)));render()})};
 $('#sr').oninput=paint;paint()}
function clientPage(){const q=cur;if(q.model===undefined)q.model=dvrOf(q);const s=q.snap||{},ta='width:100%;box-sizing:border-box;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px';
 const pd=()=>{const p=(q.pat||'').split('-').filter(Boolean);return[1,2,3,4,5,6,7,8,9].map(n=>{const i=p.indexOf(String(n));return`<button type="button" data-pt="${n}" style="width:54px;height:54px;border-radius:50%;border:2px solid var(--bd);background:${i>=0?'var(--pri)':'var(--bg)'};color:#fff;font:inherit;font-weight:700;cursor:pointer">${i>=0?i+1:''}</button>`}).join('')};
 app.innerHTML=`<button class="btn o s" data-back="1">← رجوع للعملاء</button>
<div class="card" style="margin-top:10px"><b>${esc(q.client)}</b> <span class="mut">${esc(q.phone)} · ${esc(q.place)} · تم التركيب ${new Date(q.doneAt).toLocaleDateString('en-GB')}</span><div class="row" style="margin-top:10px"><div><label>إجمالي العرض</label><input value="${fmt(s.total)}" disabled></div><div><label>العربون المدفوع</label><input type="number" data-c="deposit" value="${esc(q.deposit)}"></div><div><label>المتبقي</label><input id="rem" disabled></div></div></div>
<div class="card"><b>بيانات الجهاز</b><div class="row" style="margin-top:8px"><div><label>الماركة والموديل</label><input data-c="model" value="${esc(q.model)}"></div><div><label>كود الجهاز (Serial / Device ID)</label><input data-c="serial" value="${esc(q.serial)}"></div><div><label>الإيميل المسجل على الـDVR</label><input data-c="email" value="${esc(q.email)}"></div><div><label>باسوورد الـDVR</label><div style="display:flex;gap:6px"><input id="pw" type="password" data-c="pass" value="${esc(q.pass)}"><button class="btn o s" data-show="1">إظهار</button></div></div></div>
<label style="margin-top:10px">أسئلة الأمان وإجاباتها</label><textarea data-c="sec" rows="3" style="${ta}">${esc(q.sec)}</textarea>
<label style="margin-top:10px">علامة الفتح (Pattern): دوس النقط بالترتيب (1 فوق شمال … 9 تحت يمين)</label><div id="pg" dir="ltr" style="display:grid;grid-template-columns:repeat(3,54px);gap:10px;width:max-content;margin:6px 0">${pd()}</div><button class="btn o s" data-clr="1">مسح العلامة</button>
<label style="margin-top:10px">ملاحظات / زيارات الصيانة</label><textarea data-c="notes" rows="3" style="${ta}">${esc(q.notes)}</textarea>
<div style="margin-top:12px"><button class="btn w" data-wa="1">إرسال البيانات للعميل واتساب</button></div></div>`;
 const rem=()=>$('#rem').value=fmt(num(s.total)-num(q.deposit));rem();
 app.oninput=app.onchange=e=>{const k=e.target.dataset.c;if(!k)return;q[k]=e.target.value;if(k==='deposit')rem();saveQ()};
 app.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.back){cur=null;tab='clients';render()}
  else if(d.show){const p=$('#pw');p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'إظهار':'إخفاء'}
  else if(d.pt){const a=(q.pat||'').split('-').filter(Boolean);if(!a.includes(d.pt))a.push(d.pt);q.pat=a.join('-');$('#pg').innerHTML=pd();saveQ()}
  else if(d.clr){q.pat='';$('#pg').innerHTML=pd();saveQ()}
  else if(d.wa){const L=[['الجهاز',q.model],['كود الجهاز',q.serial],['الإيميل المسجل',q.email],['الباسوورد',q.pass],['أسئلة الأمان',q.sec],['علامة الفتح (Pattern)',q.pat?q.pat+' (ترتيب النقط من 1 فوق شمال لـ9 تحت يمين)':'']].filter(x=>x[1]).map(x=>x[0]+': '+x[1]).join('\n');open(wa(q.phone,'السلام عليكم، دي بيانات جهاز المراقبة بتاعك:\n'+L+'\nياريت تحتفظ بيها في مكان آمن.'))}}}
function pf(){const D=dones(),pr=q=>num((q.snap||{}).profit),now=new Date(),mo=D.filter(q=>{const d=new Date(q.doneAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}),big='font-size:24px;font-weight:700;color:var(--ok)';
 app.innerHTML=`<div class="card"><div class="row"><div><label>صافي ربحك من كل الشغل (${D.length} شغلانة)</label><div style="${big}">${fmt(D.reduce((a,q)=>a+pr(q),0))} ج</div></div><div><label>الشهر ده (${mo.length} شغلانة)</label><div style="${big}">${fmt(mo.reduce((a,q)=>a+pr(q),0))} ج</div></div></div><p class="mut">الربح = فرق سعر البضاعة + التركيب، من غير مصاريف الانتقالات.</p></div>
<div class="card">${D.length?[...D].sort((a,b)=>b.doneAt-a.doneAt).map(q=>{const s=q.snap||{};return`<div class="li" style="cursor:default"><div><b>${esc(q.client||'بدون اسم')}</b><div class="mut">${new Date(q.doneAt).toLocaleDateString('en-GB')} · ربح الأصناف ${fmt(num(s.sub)-num(s.cost))} + تركيب ${fmt(s.inst)}</div></div><b style="color:var(--ok)">${fmt(pr(q))} ج</b></div>`}).join(''):'<span class="mut">لسه مفيش شغلانات خلصت.</span>'}</div>`}
function mer(){app.innerHTML=`<div class="card"><b>إضافة تاجر</b><div class="row" style="margin-top:8px"><div><label>اسم التاجر</label><input id="mn"></div><div><label>رقم الواتساب</label><input id="mp" inputmode="tel"></div></div><button class="btn" id="ma" style="margin-top:10px">إضافة</button></div>
<div class="card">${merchants.length?merchants.map(m=>`<div class="li"><div><b>${esc(m.name)}</b><div class="mut">${esc(m.phone)}</div></div><button class="btn r s" data-d="${m.id}">حذف</button></div>`).join(''):'<span class="mut">مفيش تجار لسه.</span>'}</div>`;
 $('#ma').onclick=()=>{const n=$('#mn').value.trim(),p=$('#mp').value.trim();if(!n||!p)return;C.doc(rid('m')).set({name:n,phone:p})};
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.ok)C.doc(b.dataset.d).delete();else{b.dataset.ok=1;b.textContent='اضغط للتأكيد';setTimeout(()=>{b.dataset.ok='';b.textContent='حذف'},3000)}})}
function wireBk(){const m=t=>{$('#bkm').textContent=t};
$('#bk1').onclick=()=>{const docs=[...merchants,...quotes,{id:'settings',name:S.name,phone:S.phone,wa:S.wa,markup:S.markup,install:S.install}];const b=new Blob([JSON.stringify({app:'camera-quotes',v:1,at:Date.now(),docs})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();m('تم تحميل النسخة ('+docs.length+' عنصر).')};
$('#bk2').onclick=()=>$('#bkf').click();
$('#bkf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='camera-quotes'||!Array.isArray(j.docs))throw 0;if(!confirm('هيتم استرجاع '+j.docs.length+' عنصر ودمجهم مع بياناتك الحالية. تكمل؟'))return;for(const d of j.docs){const{id,...r}=d;await C.doc(id).set(r)}m('تم الاسترجاع.')}catch(x){m('الملف ده مش نسخة احتياطية صالحة.')}};
$('#lo').onclick=()=>window.__out()}
function sett(){setTimeout(wireBk);app.innerHTML=`<div class="card"><div class="row"><div><label>اسم الشركة</label><input data-s="name" value="${esc(S.name)}"></div><div><label>رقم التليفون</label><input data-s="phone" value="${esc(S.phone)}"></div><div><label>رقم الواتساب</label><input data-s="wa" value="${esc(S.wa)}"></div><div><label>نسبة الربح %</label><input type="number" data-s="markup" value="${S.markup}"></div><div><label>سعر تركيب الكاميرا</label><input type="number" data-s="install" value="${S.install}"></div></div><p class="mut">بتتحفظ تلقائي.</p></div><div class="card"><b>النسخة الاحتياطية</b><p class="mut">حمّل نسخة من كل بياناتك (العملاء والعروض والتجار) واحتفظ بيها على جهازك أو على Drive.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bk1">تحميل نسخة احتياطية</button><button class="btn o" id="bk2">استرجاع من نسخة</button><input type="file" id="bkf" accept=".json" hidden></div><p class="mut" id="bkm"></p></div><div class="card"><button class="btn r" id="lo">تسجيل الخروج</button></div>`;
 app.querySelectorAll('[data-s]').forEach(i=>i.oninput=()=>{const k=i.dataset.s;S[k]=i.type==='number'?num(i.value):i.value;clearTimeout(timer);timer=setTimeout(()=>C.doc('settings').set({name:S.name,phone:S.phone,wa:S.wa,markup:S.markup,install:S.install}),600)})}
render();
};
const G=document.getElementById('gate'),gm=document.getElementById('gmsg'),gb=document.getElementById('gbtn'),ib=document.getElementById('inst');
const say=(t,b)=>{gm.textContent=t;gb.hidden=!b};
const wait=new Promise(r=>setTimeout(r,1400));
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ib.hidden=false});
ib.onclick=()=>dip&&dip.prompt();
if(firebaseConfig.apiKey.startsWith('PASTE')){await wait;say('لسه محتاج تحط إعدادات Firebase في ملف firebase-config.js',false)}
else{
const fa=initializeApp(firebaseConfig),auth=getAuth(fa),fs=initializeFirestore(fa,{localCache:persistentLocalCache()});
window.__out=()=>signOut(auth).then(()=>location.reload());
gb.onclick=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code!=='auth/popup-closed-by-user')signInWithRedirect(auth,p)}};
let started=null;
onAuthStateChanged(auth,async u=>{await wait;
if(!u){started=null;G.classList.remove('off');say('سجّل دخولك للمتابعة',true);return}
if(started===u.uid)return;started=u.uid;
const col=collection(fs,'users',u.uid,'items'),ref=id=>doc(fs,'users',u.uid,'items',id);
const DB={doc:id=>({set:o=>setDoc(ref(id),JSON.parse(JSON.stringify(o))),delete:()=>deleteDoc(ref(id))}),onSnapshot:(cb,er)=>onSnapshot(col,s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),er)};
await window.__start(u.uid,DB);G.classList.add('off')})}
</script></body></html>
